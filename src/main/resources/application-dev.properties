spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://${DEV_DB_URL}/${DEV_DB_NAME}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}

server.secure-http=${DEV_SECURE_HTTP:false}
server.hostname=${DEV_HOSTNAME_SERVER:localhost}
server.port=${DEV_SERVER_PORT:8080}

discord.bot.token=${DEV_BOT_TOKEN}

cloud.url=${DEV_S3_URL}
cloud.credentials.access-key=${DEV_S3_KEY_ID}
cloud.credentials.secret-key=${DEV_S3_SECRET_KEY}
cloud.region.static=${DEV_S3_REGION}
cloud.bucket=${DEV_S3_BUCKET}
cloud.fixed-thread-pool=${DEV_S3_FIXEDTHREADPOOL}