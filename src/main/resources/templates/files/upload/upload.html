<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload files</title>
</head>

<body>
    <section th:if="${link.used}">
        <h3>Already used</h3>
    </section>
    <!-- <section th:if="${!link.used}"> -->
    <section>
        <form name="form" id="form">

            <fieldset id="checkboxs">
                <legend>Select the labels to associate</legend>
                <div th:each="label : ${labels}">
                    <input type="checkbox"
                        name="labelIds"
                        th:id="|label-${label.id}|"
                        th:value="${label.id}"
                        th:checked="${label.id == link.channel.labelId}">
                    <label th:for="|label-${label.id}|" th:text="${label.name}"></label>
                </div>
            </fieldset>

            <fieldset id="textarea">
                <legend>Add a description to this file/these files? (Leave blank if not)</legend>
                <textarea name="description" id="description" onkeyup="updateCharCount(event)" maxlength="2000"></textarea>
                <div id="char-count">
                    <span name="current">0</span>/<span name="max">2000</span>
                </div>
            </fieldset>

            <fieldset id="files">
                <legend>Select the files to upload from your local drive</legend>
                <div>
                    <input type="file" name="files" id="files" multiple/>
                </div>
            </fieldset>

            <div id="notification-messages"></div>
        </form>
        <br><input type="button" value="Submit" onclick="submit()"><span id="loading" hidden></span>
    </section>
</body>

<style>
    #notification-messages>.error{
        color: red;
    }

    #notification-messages>.success{
        color: cornflowerblue;
    }

    #loading{
        margin-left: 12px;
    }

    #loading:after{
        animation-name: loading;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        content: '⣾';
    }

    textarea{
        min-width: 500px;
        max-width: 500px;
        min-height: 50px;
        resize: none;
        field-sizing: content;
    }

    @keyframes loading {
        0% {
            content: "⣾";
        }
        12.5% {
            content: "⣽";
        }
        25% {
            content: "⣻";
        }
        37.5% {
            content: "⢿";
        }
        50% {
            content: "⡿";
        }
        62.5% {
            content: "⣟";
        }
        75% {
            content: "⣯";
        }
        87.5% {
            content: "⣷";
        }
    }
</style>

<script>
    class NotificationMessage {
        #node;

        constructor(id, type, message){
            this.id = id;
            this.type = type;
            this.hidden = true;
            this.message = message;
            this.#node = null
        }

        get node(){
            if (this.#node === null){
                this.buildNode()
            }
            this.updateNode()

            return this.#node
        }

        buildNode() {
            const node = document.createElement("h3")

            node.id = this.id
            node.className = this.type
            node.hidden = this.hidden
            node.textContent = this.message

            this.#node = node
            return node
        }

        updateNode() {
            this.#node.hidden = this.hidden
            this.#node.textContent = this.message
        }
    }

    const formNode = document.getElementById("form");
    const notifNode = document.getElementById("notification-messages")
    const loadingNode = document.getElementById("loading")
    const notifMessages = {
        labels: new NotificationMessage(
            "labels-error", "error",
            "You must select at least one label."
        ),
        files: new NotificationMessage(
            "files-error", "error",
            "You must select at least one file."
        ),
        uploadPartial: new NotificationMessage(
            "upload-partial-error", "error",
            "Only some of the files were uploaded."
        ),
        responseStatus: new NotificationMessage(
            "response-status-error", "error",
            "some probleme"
        ),
        upload: new NotificationMessage(
            "upload-success", "success",
            "The upload was successful."
        )
    }

    function submit() {
        const formData = new FormData(formNode);

        if (isValidForm(formData)){
            sendData(formData)
        }

    }

    async function sendData(formData) {
        loadingNode.hidden = false
        try {
            const response = await fetch(document.URL, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const msg = `Statut de réponse : ${response.status}`;

                notifMessages.responseStatus.hidden = false,
                notifMessages.responseStatus.message = msg

                throw new Error(msg);
            }

            if(response.ok){
                const result = await response.json();
                responseResult(result)
            }
        } catch (erreur) {
            console.error(erreur.message);
        }
        loadingNode.hidden = true
        updateNodeMessages()
    }

    function responseResult(result) {
        const failureItems = result["failureItems"]
        const succeededItems = result["succeededItems"]

        if(succeededItems.length > 0 && failureItems.length === 0){
            notifMessages.upload.hidden = false
        }

        if(succeededItems.length > 0 && failureItems.length > 0){
            notifMessages.uploadPartial.hidden = false
            failureItems.forEach(item => {
                notifMessages.uploadPartial.message.concat("\n- ",item.filename)
            });
        }
    }

    function isValidForm(formData) {
        const results = {
            labels: formData.getAll("labelIds").length > 0,
            files: formData.getAll("files").filter((file) => file.size > 0).length > 0
        }

        updateVisibilityErrorMessages(results);
        updateNodeMessages();

        return results.files && results.labels;
    }

    function updateNodeMessages(){

        Object.keys(notifMessages).forEach(key => {
            const msg = notifMessages[key]
            // console.log(msg)
            const exist = notifNode.children.namedItem(msg.id)
            const child = msg.node
            // child.updateNode()
            console.log(child)

            if(!exist) notifNode.appendChild(child);
        });
    }

    function updateVisibilityErrorMessages(result){
        Object.keys(result).forEach((key) => {
            notifMessages[key] !== undefined ? notifMessages[key].hidden = result[key] : console.log(key, ": not exist");
        })
    }

    function updateCharCount(event){
        const nodesCountUI = document.querySelectorAll("div#char-count>span");

        nodesCountUI.forEach(node => {
            name = node.attributes.getNamedItem("name").value;
            if(name == "current"){
                node.textContent = event.target.value.length
            }
        });
    }
</script>

</html>
